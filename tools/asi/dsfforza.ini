; dsfforza.asi settings. Put next to dsfforza.asi in <game>\plugins.
; Each [module] has enabled=1/0; other keys are per patch.

[dsfforza]
; 0 = load but patch nothing
enabled=1
; write plugins\dsfforza.log
log=1
; 1 = log faults (address, registers, Driver.exe return addresses) to the log; for crash hunts
crash_log=0

[archive]
; CHNK readers hold more than 1100 entries (dngvehicles.sp past 365 cars)
enabled=1
; largest entry count accepted (stock 1100; full model ID range needs 3003)
max_entries=16384
; file positions past 2 GiB (archives up to 4 GiB)
large_files=1
; spool item lists (SSIC SPOL) past 1100 items: gui.sp with more than 177 added garage pictures
spool_lists=1

[garage]
; garage list and save flags for added cars (research/asi.md, "Garage and save")
enabled=1
; save=0: no save hooks (then the list stays at IDs 0..303 too)
save=1
; flags of IDs 304..999 go to this file next to autosave.dat
side_file=dsfforza-garage.dat
; list=0: garage list unchanged
list=1
; the garage walks model IDs 0 .. max_id-1 (304..1000)
max_id=1000
; maker groups (stock 40; 20 cars each); 40 keeps the stock table. Past 40 the plugin
; also grows the maker menu's script lists (menusmaster.sp, 40 entries; research/asi.md)
max_groups=120
; cars per maker group (stock 20; 20 keeps the stock cap). A maker with 20 cars or more
; is shown 19 cards at a time (card 20's picture slot stays free for [hud] card_emblem): the card row scrolls on when Right (Left) reaches
; window_ahead (window_back) cards from the end (start) of what is on screen
max_cars=1000
window_ahead=8
window_back=2
; 1 = log the vehicles screen's script variables and card browser keys (debugging)
menu_debug=0

[hud]
; 16-bit HUD badge/plate glyphs (vehicleStats ManufacturerGlyph/ModelGlyph)
enabled=1
; garage car cards: Forza logo instead of the "SF" disc for cars with vehicleStats GarageEmblem = 1
; (texture from gui_assets.py's Fonts.fchunk; research/gui-assets.md, "Garage card emblem")
card_emblem=1
; 1 = log which emblem every card of every car list fill gets (debugging)
emblem_debug=0
